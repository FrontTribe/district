name: Deploy District Project

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  migrations:
    name: Verify database migrations
    runs-on: ubuntu-latest

    steps:
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if [ "$BRANCH" = "main" ]; then
            echo "path=/var/www/district-prod" >> $GITHUB_OUTPUT
            echo "app=district-prod"           >> $GITHUB_OUTPUT
            echo "branch=main"                 >> $GITHUB_OUTPUT
          else
            echo "path=/var/www/district-dev"  >> $GITHUB_OUTPUT
            echo "app=district-dev"            >> $GITHUB_OUTPUT
            echo "branch=development"          >> $GITHUB_OUTPUT
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check migration registry (PR)
        if: github.event_name == 'pull_request'
        run: SKIP_DB_CHECK=true node scripts/check-pending-migrations.mjs

      - name: Package source for migration check
        if: github.event_name == 'push'
        run: git archive --format=tar.gz -o source.tgz HEAD

      - name: Upload source to server
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: source.tgz
          target: /tmp/

      - name: Verify migrations on server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          timeout: 10m
          script_stop: true
          script: |
            set -euxo pipefail

            DEPLOY_PATH="${{ steps.target.outputs.path }}"
            APP_NAME="${{ steps.target.outputs.app }}"
            OPS_PATH="${DEPLOY_PATH}-ops"

            rm -rf "$OPS_PATH"
            mkdir -p "$OPS_PATH"
            tar -xzf /tmp/source.tgz -C "$OPS_PATH"
            rm -f /tmp/source.tgz

            for env_file in .env .env.local .env.production; do
              if [ -f "$DEPLOY_PATH/$env_file" ]; then
                set -a
                # shellcheck disable=SC1090
                source "$DEPLOY_PATH/$env_file"
                set +a
              fi
            done

            if [ -z "${DATABASE_URI:-}" ] || [ -z "${PAYLOAD_SECRET:-}" ]; then
              echo "Missing DATABASE_URI or PAYLOAD_SECRET in $DEPLOY_PATH env files."
              exit 1
            fi

            cd "$OPS_PATH"
            corepack enable
            corepack prepare pnpm@10.11.0 --activate
            pnpm install --frozen-lockfile
            chmod +x scripts/server/seed

            if [ "$APP_NAME" = "district-dev" ]; then
              pnpm run payload -- migrate
            fi

            pnpm run check:migrations

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Set build target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if [ "$BRANCH" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write build env
        run: |
          if [ "${{ steps.target.outputs.environment }}" = "production" ]; then
            cat <<'EOF' > .env.local
          NEXT_PUBLIC_ROOT_DOMAIN=${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}
          NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL_PROD }}
          NEXT_PUBLIC_PAYLOAD_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL_PROD }}
          NEXT_PUBLIC_DEV_ROOT_DOMAIN=dev.district.hr
          NEXT_PUBLIC_RENTLIO_API_KEY=${{ secrets.NEXT_PUBLIC_RENTLIO_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EOF
          else
            cat <<'EOF' > .env.local
          NEXT_PUBLIC_ROOT_DOMAIN=${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}
          NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL_DEV }}
          NEXT_PUBLIC_PAYLOAD_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL_DEV }}
          NEXT_PUBLIC_ENVIRONMENT=dev
          NEXT_PUBLIC_DEV_ROOT_DOMAIN=dev.district.hr
          NEXT_PUBLIC_RENTLIO_API_KEY=${{ secrets.NEXT_PUBLIC_RENTLIO_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EOF
          fi

      - name: Build
        run: NODE_ENV=production pnpm build

      - name: Prepare standalone
        if: github.event_name == 'push'
        run: |
          cp -r public         .next/standalone/public
          cp -r .next/static   .next/standalone/.next/static

      - name: Package artifact
        if: github.event_name == 'push'
        run: tar -czf deploy.tgz -C .next/standalone .

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ github.sha }}
          path: deploy.tgz
          retention-days: 1

  deploy:
    name: Deploy
    needs: [migrations, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=/var/www/district-prod" >> $GITHUB_OUTPUT
            echo "app=district-prod"           >> $GITHUB_OUTPUT
            echo "port=3000"                   >> $GITHUB_OUTPUT
          else
            echo "path=/var/www/district-dev"  >> $GITHUB_OUTPUT
            echo "app=district-dev"            >> $GITHUB_OUTPUT
            echo "port=3001"                   >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-${{ github.sha }}

      - name: Upload artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: deploy.tgz
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          timeout: 5m
          script_stop: true
          script: |
            set -euxo pipefail

            DEPLOY_PATH="${{ steps.target.outputs.path }}"
            APP_NAME="${{ steps.target.outputs.app }}"
            APP_PORT="${{ steps.target.outputs.port }}"

            # Dev: apply Payload DB migrations on each deploy so schema matches code (e.g. new block tables).
            # Prod: keep off so migrations stay an explicit ops step if you prefer controlled DB changes.
            # Use "|| :" so a false [ ] test never trips set -e under appleboy/ssh-action (script_stop).
            RUN_MIGRATIONS_ON_BOOT="false"
            [ "$APP_NAME" = "district-dev" ] && RUN_MIGRATIONS_ON_BOOT="true" || :

            # Stop old process before touching files to avoid serving half-deleted builds
            pm2 delete "$APP_NAME" > /dev/null 2>&1 || true

            # Cleanup legacy production aliases so an old process definition does not restart-loop.
            if [ "$APP_NAME" = "district-prod" ]; then
              pm2 delete district > /dev/null 2>&1 || true
              pm2 delete distric > /dev/null 2>&1 || true
            fi

            # Backup env files before wiping
            for env_file in .env .env.local .env.production; do
              if [ -f "$DEPLOY_PATH/$env_file" ]; then
                cp "$DEPLOY_PATH/$env_file" "/tmp/$(basename $env_file).bak"
              fi
            done

            # Force permissions then wipe contents (can't remove the dir itself)
            mkdir -p "$DEPLOY_PATH"
            chmod -R u+rwX "$DEPLOY_PATH" 2>/dev/null || true
            find "$DEPLOY_PATH" -mindepth 1 -delete 2>/dev/null || rm -rf "$DEPLOY_PATH"/* "$DEPLOY_PATH"/.[!.]* 2>/dev/null || true

            # Extract standalone artifact into clean dir
            tar -xzf /tmp/deploy.tgz -C "$DEPLOY_PATH"
            rm -f /tmp/deploy.tgz

            # Restore env files
            for env_file in .env .env.local .env.production; do
              if [ -f "/tmp/$(basename $env_file).bak" ]; then
                cp "/tmp/$(basename $env_file).bak" "$DEPLOY_PATH/$env_file"
                rm -f "/tmp/$(basename $env_file).bak"
              fi
            done

            OPS_PATH="${DEPLOY_PATH}-ops"
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              "export DISTRICT_DEPLOY_PATH=\"$DEPLOY_PATH\"" \
              "export DISTRICT_OPS_PATH=\"$OPS_PATH\"" \
              "exec \"$OPS_PATH/scripts/server/seed\" \"\$@\"" \
              > "$DEPLOY_PATH/seed"
            chmod +x "$DEPLOY_PATH/seed"

            # Standalone builds must be started with Node against the generated entrypoint
            test -f "$DEPLOY_PATH/server.js"
            PORT="$APP_PORT" NODE_ENV=production PAYLOAD_DB_PUSH=false PAYLOAD_RUN_MIGRATIONS_ON_BOOT="$RUN_MIGRATIONS_ON_BOOT" pm2 start \
              "$DEPLOY_PATH/server.js" \
              --name "$APP_NAME" \
              --cwd  "$DEPLOY_PATH" \
              --update-env

            pm2 save
            echo "✓ $APP_NAME deployed on port $APP_PORT"
