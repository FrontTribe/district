<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>District · Landing redesign</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html, body { margin: 0; padding: 0; background: #f6f3ee; height: 100%; font-family: 'Inter', sans-serif; }
    #root { height: 100vh; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="direction-a.jsx"></script>
  <script type="text/babel" src="direction-b.jsx"></script>
  <script type="text/babel" src="direction-c.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { DirectionA, DirectionB, DirectionC } = window;

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="brief"
            title="Redesign · district.hr"
            subtitle="Three hub variations, each at 1440×900 (one full viewport). Just three brand columns — no scroll. Hover for reveal where applicable.">
            <Brief />
          </DCSection>

          <DCSection
            id="hubs"
            title="Three hubs">
            <DCArtboard id="a" label="A · Cinematic Triptych — dark, full-bleed, gold" width={1440} height={900}>
              <DirectionA />
            </DCArtboard>
            <DCArtboard id="b" label="B · Editorial Cream — serif, magazine, photo per column" width={1440} height={900}>
              <DirectionB />
            </DCArtboard>
            <DCArtboard id="c" label="C · Architectural Index — brutalist, gridded, mono" width={1440} height={900}>
              <DirectionC />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    function Brief() {
      const s = {
        width: 920,
        background: '#fffdf6',
        border: '1px solid #e2dccb',
        borderRadius: 4,
        padding: '26px 30px',
        fontFamily: "'Inter', sans-serif",
        color: '#2a241d',
        boxShadow: '0 2px 12px rgba(0,0,0,0.04)',
        lineHeight: 1.55,
      };
      return (
        <div style={s}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom: 14, paddingBottom: 12, borderBottom: '1px solid #e2dccb'}}>
            <div style={{fontFamily:"'Fraunces', serif", fontSize: 30, letterSpacing: '-0.02em'}}>Hub redesign · district.hr</div>
            <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize: 11, letterSpacing: '0.18em', textTransform:'uppercase', color:'#8c8170'}}>v2 · 3 hubs · 100vh</div>
          </div>
          <p style={{margin:'0 0 14px', fontSize: 14}}>
            district.hr je hub — tri kolumne, jedan viewport, klik vodi na poseban brand site (boutique / momento / realestate). Ne ide u scroll. Sve ostale stranice idu u zasebne projekte.
          </p>
          <div style={{display:'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 16, marginTop: 6}}>
            <div>
              <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize: 10, letterSpacing: '0.18em', textTransform:'uppercase', color:'#8c8170', marginBottom: 6}}>A · Cinematic Triptych</div>
              <div style={{fontSize: 13}}>Tri full-bleed fotke, tamno + gold. Copy se sklupča kad hoveraš. Najbliže "luxury group".</div>
            </div>
            <div>
              <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize: 10, letterSpacing: '0.18em', textTransform:'uppercase', color:'#8c8170', marginBottom: 6}}>B · Editorial Cream</div>
              <div style={{fontSize: 13}}>Krem papir, veliki serif, mala fotka po kolumni. Quiet magazine, najtopliji ton.</div>
            </div>
            <div>
              <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize: 10, letterSpacing: '0.18em', textTransform:'uppercase', color:'#8c8170', marginBottom: 6}}>C · Architectural Index</div>
              <div style={{fontSize: 13}}>Brutalist, mono, gridded. Status indikatori + crosshair fotke. Čita se kao registar.</div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
