# Local Postgres for Payload (`@payloadcms/db-postgres`).
# Run: docker compose up -d
# Ensure .env.local defines POSTGRES_* and a matching DATABASE_URI (host 127.0.0.1, port 5434).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Use 5434 on the host if 5433 is already taken (e.g. tunnel or local Postgres).
      - '5434:5432'
    env_file:
      - .env.local
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
